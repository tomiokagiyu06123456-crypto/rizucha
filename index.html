<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>りずちゃ</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; color: #000000; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
        h2 { text-align: center; margin: 10px 0; font-size: 1.2rem; border-bottom: 1px solid #000000; padding-bottom: 5px; }
        #chat-window { flex: 1; background: #ffffff; border: 1px solid #000000; padding: 15px; overflow-y: auto; margin-bottom: 10px; }
        #input-area { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #000000; font-size: 16px; }
        button { padding: 12px 18px; border: 1px solid #000000; background: #ffffff; color: #000000; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:active { background: #eeeeee; }
        .msg { margin-bottom: 8px; padding: 8px; border-bottom: 1px dashed #ccc; width: 100%; word-break: break-all; }
        .system-msg { color: #666666; font-size: 0.9rem; text-align: center; border: none; }
    </style>
</head>
<body>

    <h2>🎙️ りずちゃ</h2>

    <div id="chat-window">
        <div class="msg system-msg" id="status-msg">システム: 接続中...</div>
    </div>
    
    <div id="input-area">
        <button id="mic-btn" onclick="toggleMic()">🎙️ 通話</button>
        <input type="text" id="msg-input" placeholder="メッセージを入力...">
        <button id="send-btn" onclick="sendMsg()">送信</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://gstatic.com";

        // 【修正完了】あなたの新しい部屋の正しい鍵（appIdの最新版）に書き換えました！
        // 通信ブロックを防ぐため、原因になりやすい authDomain は最初から消してあります。
        const firebaseConfig = {
            apiKey: "AIzaSyCRt8X8NIegDI63IPZo4f9vb6J5zHx7NxA",
            projectId: "rizucha-e3102",
            storageBucket: "rizucha-e3102.firebasestorage.app",
            messagingSenderId: "908166388833",
            appId: "1:908166388833:web:3307cdfebd82e4815e20"
        };

        let db = null;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            
            // 安全のために「test_chat」という名前の引き出しで通信を開始します
            onSnapshot(collection(db, "test_chat"), (snapshot) => {
                const chatWindow = document.getElementById('chat-window');
                chatWindow.innerHTML = '<div class="msg system-msg">システム: 「りずちゃ」へようこそ！チャットを開通しました。</div>';
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const newMsg = document.createElement('div');
                    newMsg.className = 'msg';
                    newMsg.textContent = data.text || "";
                    chatWindow.appendChild(newMsg);
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });
            document.getElementById('status-msg').textContent = "システム: 「りずちゃ」へようこそ！チャットを開通しました。";
        } catch (e) {
            console.error(e);
            document.getElementById('status-msg').textContent = "システム: 接続エラーが発生しました。";
        }

        window.sendMsg = async function() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text === "") return;
            
            input.value = "";

            if (db) {
                try {
                    await addDoc(collection(db, "test_chat"), {
                        text: text
                    });
                } catch (e) {
                    console.error("送信エラー:", e);
                    alert("送信に失敗しました。");
                }
            }
        };

        let isCalling = false;
        window.toggleMic = function() {
            isCalling = !isCalling;
            const btn = document.getElementById('mic-btn');
            if (isCalling) {
                btn.textContent = "🛑 切断";
                alert("ボイスチャット（通話）の仕組みは、文字チャットのテスト成功後に作成します！まずは文字が届くか試しましょう。");
            } else {
                btn.textContent = "🎙️ 通話";
            }
        };
    </script>
</body>
</html>
