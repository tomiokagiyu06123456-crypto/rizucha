<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>りずちゃ</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; color: #000000; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
        h2 { text-align: center; margin: 10px 0; font-size: 1.2rem; border-bottom: 1px solid #000000; padding-bottom: 5px; }
        #chat-window { flex: 1; background: #ffffff; border: 1px solid #000000; padding: 15px; overflow-y: auto; margin-bottom: 10px; }
        #input-area { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #000000; font-size: 16px; }
        button { padding: 12px 18px; border: 1px solid #000000; background: #ffffff; color: #000000; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:active { background: #eeeeee; }
        .msg { margin-bottom: 8px; padding: 8px; border-bottom: 1px dashed #ccc; width: 100%; word-break: break-all; }
        .system-msg { color: #666666; font-size: 0.9rem; text-align: center; border: none; }
    </style>
</head>
<body>

    <h2>🎙️ りずちゃ</h2>

    <div id="chat-window">
        <div class="msg system-msg">システム: 「りずちゃ」へようこそ！チャットを開通しました。</div>
    </div>
    
    <div id="input-area">
        <button id="mic-btn">🎙️ 通話</button>
        <input type="text" id="msg-input" placeholder="メッセージを入力...">
        <button id="send-btn">送信</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://gstatic.com";

        // あなたのFirebaseの鍵
        const firebaseConfig = {
            apiKey: "AIzaSyCRt8X8NIegDI63IPZo4f9vb6J5zHx7NxA",
            authDomain: "://firebaseapp.com",
            projectId: "rizucha-e3102",
            storageBucket: "rizucha-e3102.firebasestorage.app",
            messagingSenderId: "908166388833",
            appId: "1:908166388833:web:7a917363456682e4815e20"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const chatWindow = document.getElementById('chat-window');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');

        // リアルタイムに文字を受信して画面に出す処理
        const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            chatWindow.innerHTML = '<div class="msg system-msg">システム: 「りずちゃ」へようこそ！チャットを開通しました。</div>';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const newMsg = document.createElement('div');
                newMsg.className = 'msg';
                newMsg.textContent = data.text;
                chatWindow.appendChild(newMsg);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });

        // 送信ボタンが押されたときにデータベースへ文字を届ける処理
        sendBtn.addEventListener('click', async () => {
            const text = msgInput.value.trim();
            if (text === "") return;
            
            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    createdAt: new Date()
                });
                msgInput.value = "";
            } catch (e) {
                console.error("送信エラー: ", e);
            }
        });

        // 仮の通話ボタンの処理
        let isCalling = false;
        micBtn.addEventListener('click', () => {
            isCalling = !isCalling;
            if (isCalling) {
                micBtn.textContent = "🛑 切断";
                alert("ボイスチャット（通話）の仕組みは、文字チャットのテスト成功後に作成します！まずは文字が届くか試しましょう。");
            } else {
                micBtn.textContent = "🎙️ 通話";
            }
        });
    </script>
</body>
</html>
